# tiny8: an example 8-bit accumulator ISA with variable-length instructions.
# Every instruction starts with an opcode byte; 0, 1 or 2 operand bytes follow.
# Little-endian, so bits [7:0] of each format are the first byte in memory.
#
#   python3 -I tools/validate_isa.py examples/tiny8.toml
#   python3 -I tools/asm.py examples/tiny8.toml examples/count8.s --listing

[meta]
schema_version = "0.1"
name           = "tiny8"
version        = "0.1.0"
status         = "draft"
description    = "Example 8-bit accumulator ISA: opcode byte plus 0-2 operand bytes."

[isa]
xlen              = 8                 # 8-bit data
endianness        = "little"
instruction_width = "variable"        # size comes from each format's width
fetch_alignment   = 1
reset_pc          = 0x0200
address_bits      = 16

[isa.encoding_lengths]
rules = [
  { bits = 8,  when = "opcode[7:4] == 0x0" },
  { bits = 16, when = "opcode[7:4] in (0x1, 0x2, 0x5)" },
  { bits = 24, when = "opcode[7:4] in (0x3, 0x4)" },
]

[semantics]
language   = "isa-pseudo-v0"
primitives = ["A", "Z", "pc", "mem_read(addr, bytes)", "mem_write(addr, bytes, value)", "sext(value, from_bits)", "push16(v)", "pop16()", "halt()"]

[[extension]]
name      = "base"
mandatory = true
depends_on = []

[[register]]
name  = "a"
width = 8
description = "Accumulator (implicit in every ALU and load/store instruction)."

[[register]]
name  = "pc"
width = 16

# --- formats: opcode byte first, operands after ------------------------------
[[format]]
name  = "N"
width = 8
description = "Opcode only."
  [[format.field]]
  name = "opcode"
  bits = [7, 0]

[[format]]
name  = "I"
width = 16
description = "Opcode + 8-bit immediate."
  [[format.field]]
  name = "imm8"
  bits = [15, 8]
  [[format.field]]
  name = "opcode"
  bits = [7, 0]

[[format]]
name  = "Z"
width = 16
description = "Opcode + zero-page address (0x00-0xff)."
  [[format.field]]
  name = "zp"
  bits = [15, 8]
  [[format.field]]
  name = "opcode"
  bits = [7, 0]

[[format]]
name  = "A"
width = 24
description = "Opcode + 16-bit absolute address, low byte first."
  [[format.field]]
  name = "addr"
  bits = [23, 8]
  [[format.field]]
  name = "opcode"
  bits = [7, 0]

[[format]]
name  = "B"
width = 16
description = "Opcode + signed 8-bit branch offset from the branch's own address."
  [[format.field]]
  name = "rel"
  bits = [15, 8]
  [[format.field]]
  name = "opcode"
  bits = [7, 0]

# 8-bit values: unsigned, and because bits == xlen, -128..-1 are accepted too.
[[immediate]]
name   = "imm8"
format = "I"
bits   = 8
signed = false
parts  = [ { field = "imm8", dst_lsb = 0 } ]

[[immediate]]
name   = "zp"
format = "Z"
bits   = 8
signed = false
parts  = [ { field = "zp", dst_lsb = 0 } ]

[[immediate]]
name   = "addr"
format = "A"
bits   = 16
signed = false
parts  = [ { field = "addr", dst_lsb = 0 } ]

[[immediate]]
name   = "rel"
format = "B"
bits   = 8
signed = true
parts  = [ { field = "rel", dst_lsb = 0 } ]

# --- instructions --------------------------------------------------------------
# lda/sta have a 2-byte zero-page form and a 3-byte absolute form with the same
# mnemonic. The assembler uses the zero-page form when the address is known and
# fits in a byte, and the absolute form otherwise (including forward references).

[[instruction]]
name      = "nop"
extension = "base"
format    = "N"
encoding.fixed = { opcode = "00000000" }
assembly  = "nop"

[[instruction]]
name      = "hlt"
extension = "base"
format    = "N"
encoding.fixed = { opcode = "00000001" }
assembly  = "hlt"
semantics = "halt()"

[[instruction]]
name      = "ret"
extension = "base"
format    = "N"
encoding.fixed = { opcode = "00000010" }
assembly  = "ret"
semantics = "pc = pop16()"

[[instruction]]
name      = "lda_imm"
extension = "base"
format    = "I"
encoding.fixed = { opcode = "00010000" }
operands  = [ { name = "imm8", kind = "imm" } ]
assembly  = "lda #{imm8}"
semantics = "A = imm8; Z = (A == 0)"

[[instruction]]
name      = "add_imm"
extension = "base"
format    = "I"
encoding.fixed = { opcode = "00010001" }
operands  = [ { name = "imm8", kind = "imm" } ]
assembly  = "add #{imm8}"
semantics = "A = (A + imm8)[7:0]; Z = (A == 0)"

[[instruction]]
name      = "sub_imm"
extension = "base"
format    = "I"
encoding.fixed = { opcode = "00010010" }
operands  = [ { name = "imm8", kind = "imm" } ]
assembly  = "sub #{imm8}"
semantics = "A = (A - imm8)[7:0]; Z = (A == 0)"

[[instruction]]
name      = "cmp_imm"
extension = "base"
format    = "I"
encoding.fixed = { opcode = "00010011" }
operands  = [ { name = "imm8", kind = "imm" } ]
assembly  = "cmp #{imm8}"
semantics = "Z = (A == imm8)"

[[instruction]]
name      = "lda_zp"
extension = "base"
format    = "Z"
encoding.fixed = { opcode = "00100000" }
operands  = [ { name = "zp", kind = "imm" } ]
assembly  = "lda {zp}"
semantics = "A = mem_read(zp, 1); Z = (A == 0)"
flags     = ["reads_mem"]

[[instruction]]
name      = "sta_zp"
extension = "base"
format    = "Z"
encoding.fixed = { opcode = "00100001" }
operands  = [ { name = "zp", kind = "imm" } ]
assembly  = "sta {zp}"
semantics = "mem_write(zp, 1, A)"
flags     = ["writes_mem"]

[[instruction]]
name      = "lda_abs"
extension = "base"
format    = "A"
encoding.fixed = { opcode = "00110000" }
operands  = [ { name = "addr", kind = "imm" } ]
assembly  = "lda {addr}"
semantics = "A = mem_read(addr, 1); Z = (A == 0)"
flags     = ["reads_mem"]

[[instruction]]
name      = "sta_abs"
extension = "base"
format    = "A"
encoding.fixed = { opcode = "00110001" }
operands  = [ { name = "addr", kind = "imm" } ]
assembly  = "sta {addr}"
semantics = "mem_write(addr, 1, A)"
flags     = ["writes_mem"]

[[instruction]]
name      = "jmp"
extension = "base"
format    = "A"
encoding.fixed = { opcode = "01000000" }
operands  = [ { name = "addr", kind = "imm" } ]
assembly  = "jmp {addr}"
semantics = "pc = addr"
flags     = ["branch"]

[[instruction]]
name      = "jsr"
extension = "base"
format    = "A"
encoding.fixed = { opcode = "01000001" }
operands  = [ { name = "addr", kind = "imm" } ]
assembly  = "jsr {addr}"
semantics = "push16(pc + 3); pc = addr"
flags     = ["branch"]

[[instruction]]
name      = "beq"
extension = "base"
format    = "B"
encoding.fixed = { opcode = "01010000" }
operands  = [ { name = "rel", kind = "imm", pc_relative = true } ]
assembly  = "beq {rel}"
semantics = "if Z: pc = pc + sext(rel, 8)"
flags     = ["branch"]

[[instruction]]
name      = "bne"
extension = "base"
format    = "B"
encoding.fixed = { opcode = "01010001" }
operands  = [ { name = "rel", kind = "imm", pc_relative = true } ]
assembly  = "bne {rel}"
semantics = "if !Z: pc = pc + sext(rel, 8)"
flags     = ["branch"]

[[pseudo_instruction]]
name       = "clr"
assembly   = "clr"
expands_to = ["lda #0"]

[[pseudo_instruction]]
name       = "dec"
assembly   = "dec"
expands_to = ["sub #1"]
